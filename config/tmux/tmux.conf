# ~/.tmux.conf
# Reorganizado 2026-08-17. Respaldo del anterior en ~/.config-backup-*/tmux.conf
# Cambios: Catppuccin v2 bien configurado, barra rediseñada, y status-interval
# de 1s a 5s (la barra gastaba ~12% de un núcleo lanzando 3 procesos por segundo).

# ─── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # opciones sensatas de base
set -g @plugin 'tmux-plugins/tmux-yank'          # portapapeles
set -g @plugin 'christoomey/vim-tmux-navigator'  # moverse entre panes y vim
set -g @plugin 'tmux-plugins/tmux-resurrect'     # guarda y restaura sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'     # autoguardado
set -g @plugin 'laktak/extrakto'                 # buscador difuso del buffer
set -g @plugin 'tmux-plugins/tmux-sessionist'    # gestor de sesiones
set -g @plugin 'alexwforsythe/tmux-which-key'    # menú de atajos
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'pschmitt/tmux-ssh-split'         # splits por SSH al mismo host
# tmux-spotify-status retirado: lo sustituye ~/.config/tmux/scripts/nowplaying.sh,
# que ademas soporta Tidal (no scriptable con AppleScript) con una sola llamada.

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Restaurar también los panes que corrían ssh (sesiones remotas)
set -g @resurrect-processes 'ssh'

# tmux-ssh-split: prefix+v / prefix+d / prefix+c sobre un pane con ssh abren otro
# ssh al mismo host y en la misma carpeta remota (el host emite OSC 7 desde su
# .bashrc). Sobre un pane local hacen el split normal, en la carpeta actual.
# Al salir del ssh el pane se cierra (no cae a un zsh local).
set -g @ssh-split-h-key 'v'
set -g @ssh-split-v-key 'd'
set -g @ssh-split-w-key 'c'
set -g @ssh-split-keep-cwd 'true'
set -g @ssh-split-keep-remote-cwd 'true'
set -g @ssh-split-strip-cmd 'true'
set -g @ssh-split-no-shell 'true'

# tmux-sessionist:
#   prefix + g  listar sesiones     prefix + C  nueva sesión
#   prefix + X  matar sesión        prefix + S  última sesión
#   prefix + @  promover pane a sesión nueva

# ─── Terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -s extended-keys off
set -g allow-passthrough on          # necesario para snacks.nvim y nvim 0.11+

# ─── Prefijo y atajos ─────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Recargar la configuración sin reiniciar tmux
bind r source-file ~/.tmux.conf \; display-message "  tmux.conf recargado"

# ─── Modo vim y copiado ───────────────────────────────────────────────────────
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# ─── Comportamiento general ───────────────────────────────────────────────────
set -g mouse on
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on           # al cerrar una ventana, renumera el resto
set -g history-limit 50000           # más scrollback
set -g escape-time 10                # menos retardo al pulsar Esc en vim
set -g focus-events on

# Renombrado automático de ventanas
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set -g allow-rename on
set -g set-titles off

# ─── Gestión de sesiones ──────────────────────────────────────────────────────
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"
bind R command-prompt -p "Rename session:" "rename-session '%%'"

# prefix+s / prefix+S: selector y asistente de ws (plugin tmux-ws, cargado al
# final del archivo). prefix+C-s sigue siendo el árbol clásico.

# Ventana flotante por sesión (Alt+g para entrar y salir). En sesiones remotas
# la flotante también va por SSH (ver scripts/float-open.sh).
# Cerrarla a mano borra la marca @float_abierta: ws ya no la reabrirá al volver.
bind-key -n M-g if-shell -F '#{m:f-*,#{session_name}}' {
  run-shell 'tmux set -t "=#{s/^f-//:session_name}:" @float_abierta 0'
  detach-client
} {
  run-shell -b '~/.config/tmux/scripts/float-open.sh'
}

# ─── Sesiones remotas ─────────────────────────────────────────────────────────
# nombre=host (alias de ~/.ssh/config), separados por espacios. En estas sesiones
# todo pane nuevo, split o flotante abre `ssh <host>`. Ver scripts/remote-session.sh.
# Los pares nombre=host y su atajo son privados (equipos del trabajo): viven en
# ~/dotfiles/private/tmux.conf (submódulo dotfiles-privado). Sin él, no hay ninguna.
set -g @remote_sessions ''
source-file -q ~/dotfiles/private/tmux.conf
# (el hook que las marca va tras el session-created de las flotantes, más abajo)

# ─── Tema Catppuccin Mocha ────────────────────────────────────────────────────
# OJO: este plugin es la v2. Antes la config usaba nombres de la v1
# (@catppuccin_flavour con grafía británica, @catppuccin_status_modules_*) que la
# v2 ignora en silencio — por eso el tema no se aplicaba del todo.
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
# Espacio a ambos lados del nombre para que las pestañas respiren
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
# Sin iconos de estado por pestaña: el color ya distingue la activa
set -g @catppuccin_window_flags "none"

# Hueco entre pestañas, para que no queden pegadas unas a otras
set -g window-status-separator "  "

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Bordes de los panes
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"

# ─── Barra de estado ──────────────────────────────────────────────────────────
# Refresco cada 5 s en lugar de 1 s: la barra lanzaba 3 procesos por segundo
# (~12% de un núcleo con la terminal abierta todo el día).
set -g status-interval 5
# OJO con estos límites: tmux los mide sobre la longitud CRUDA de la cadena,
# incluyendo el texto completo de cada `#(...)`. Las rutas de los scripts de
# Spotify y continuum suman ~300 caracteres, así que con el valor por defecto
# (100) todo lo que va detrás — la hora y la fecha — se cortaba y no se veía.
set -g status-left-length 200
set -g status-right-length 1000
set -g status-justify left

# Izquierda: icono de terminal + nombre de sesión + separador, con el mismo
# lenguaje visual que la derecha (icono en color, texto claro, barra ▐ gris).
# El módulo de catppuccin pegaba el icono al nombre sin separación alguna.
# Si la sesión pertenece a una organización (ws), su proyecto va detrás en malva.
set -g status-left "#[fg=#a6e3a1,bold]   #S #{?@ws,#[fg=#cba6f7#,nobold] #{@ws} ,}#[fg=#585b70]▐ "

# Derecha: hora y fecha, cada una con su icono y separadas por espacio.
# OJO: NO se llama aquí a spotify.sh — el plugin antepone su propio módulo a
# status-right cuando se carga. Ponerlo también aquí lo duplicaba en pantalla
# y ejecutaba el script dos veces por refresco.
set -g status-right "#(~/.config/tmux/scripts/nowplaying.sh)"
set -ag status-right "#[fg=#585b70]  ▐  #[fg=#cdd6f4]%H:%M  "

# Al cerrar una sesión, matar su flotante `f-<nombre>` si quedó viva. Sin esto se
# acumulan huérfanas invisibles: el selector (prefix+s) las filtra a propósito, así
# que ni siquiera las ves para matarlas a mano.
set-hook -g session-closed 'run-shell "~/.config/tmux/scripts/kill-orphan-float.sh #{hook_session_name}"'

# Sesiones flotantes (popup de Alt+g): barra mínima abajo. Aquí solo las
# opciones de SESIÓN; el formato de las ventanas se envuelve tras TPM (abajo),
# porque window-status-format es opción de ventana y no se hereda por sesión.
set-hook -g session-created 'if-shell -F "#{m:f-*,#{session_name}}" "\
  set status on; \
  set status-position bottom; \
  set status-style bg=default; \
  set status-justify centre; \
  set status-left \"\"; \
  set status-right \"\"; \
  set status-interval 60"'

# Sesiones remotas (@remote_sessions): al crearse —también al restaurarlas
# tmux-resurrect y sus flotantes f-*— quedan marcadas con su host SSH.
# Índice fijo [1] y DESPUÉS del hook anterior: un `set-hook` sin índice vacía el
# array entero, y con -a se duplicaría en cada recarga (prefix+r).
set-hook -g 'session-created[1]' 'run-shell "~/.config/tmux/scripts/remote-session.sh apply #{hook_session_name}"'


# ─── Panel de procesos en segundo plano de Claude Code ────────────────────────
# prefix + b   abre/cierra un panel a la derecha con agentes y procesos bash
# prefix + B   selector con vista previa para inspeccionar uno concreto
#
# El panel es un pane normal en vez de un popup a propósito: así puedes dejarlo
# abierto mientras trabajas, que es justo lo que se pedía.
bind b run-shell "~/.config/tmux/scripts/claude-bg-toggle.sh"

bind B display-popup -w 88% -h 82% -b rounded \
  -s "fg=#cdd6f4,bg=#181825" -S "fg=#585b70" -T "  procesos en segundo plano " \
  -E "~/.config/tmux/scripts/claude-bg-ver.sh"

# ─── TPM (debe ir al final) ───────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ─── Ajustes que deben ir DESPUÉS de los plugins ──────────────────────────────
# tmux-spotify-status fuerza `status-interval 1` al cargarse para que el título
# de la canción haga scroll suave. Eso son 3 procesos por segundo, todo el día:
# ~12% de un núcleo medido. Lo devolvemos a 5 s aquí, ya cargado el plugin.
# El nombre de la canción se sigue viendo; solo el desplazamiento va a saltos.
# Si prefieres el scroll suave, sube el número o borra estas dos líneas.
set -g status-interval 5

# Formatos de ventana condicionados al tipo de sesión (ver el script)
run-shell '~/.config/tmux/scripts/float-setup.sh'

# tmux-sessionist reasigna prefix+S (ir a la ultima sesion) y prefix+C-s al
# cargarse con TPM, pisando estos dos. Por eso van aqui abajo: definidos despues
# del plugin, ganan ellos.
bind C-s choose-tree -Zs

# ws (repo tmux-ws, instalado por home-manager): prefix+s selector, prefix+S
# nueva sesión, hook que marca @ws. Va después de TPM para ganarle prefix+S a
# tmux-sessionist. Con el script de flotantes, ws las cierra y reabre solo.
set -g @ws-float-script '~/.config/tmux/scripts/float-open.sh'
# Tema de ws con la paleta de la barra (catppuccin mocha) y los iconos de Nerd Font.
set -g @ws-color-accent    '#cba6f7'
set -g @ws-color-active    '#a6e3a1'
set -g @ws-color-muted     '#6c7086'
set -g @ws-color-dim       '#585b70'
set -g @ws-color-info      '#89b4fa'
set -g @ws-color-text      '#cdd6f4'
set -g @ws-color-match     '#f38ba8'
set -g @ws-color-selection '#313244'
set -g @ws-color-border    '#45475a'
set -g @ws-nerd-font on
set -g @ws-lang es
run-shell '~/.local/share/ws/tmux/ws.tmux'

# tmux-hibernate (repo propio ~/Documents/GitHub/tmux-hibernate): las sesiones sin
# cliente durante 3 h cierran nvim y los agentes (o congelan lo demás) y vuelven
# solas al entrar. Las de ssh se ignoran por defecto. Solo si el repo está clonado.
set -g @hibernate-log '~/.local/state/tmux-hibernate/log'
if-shell 'test -x ~/Documents/GitHub/tmux-hibernate/hibernate.tmux' \
  "run-shell '~/Documents/GitHub/tmux-hibernate/hibernate.tmux'"

# Estilo de los popups (menús, prompts y el flotante de Alt+g).
# Va DESPUÉS de TPM porque catppuccin fija las suyas al cargar.
# OJO: un estilo con solo `bg` hace que tmux pinte el texto en gris por defecto
# — era la causa de que Claude Code se viera apagado dentro del flotante.
set -g popup-style "fg=#cdd6f4,bg=#181825"
set -g popup-border-style "fg=#585b70"
set -g popup-border-lines rounded

# Línea de mensajes y prompt de `:`.
# Catppuccin las deja con `align=centre` y con un fondo sin `fill`. En tmux 3.7
# eso rompe el prompt de dos maneras: el texto sale desplazado y se come el `:`
# inicial, y la barra no se repinta, así que el status anterior se queda de fondo
# debajo de lo que escribes. Sin `align` el prompt vuelve a la izquierda; `fill`
# obliga a tmux a limpiar la línea entera antes de dibujarlo.
set -g message-style "fg=#94e2d5,bg=#181825,fill=#181825"
set -g message-command-style "fg=#94e2d5,bg=#181825,fill=#181825"
