# ~/.tmux.conf
# Reorganizado 2026-08-17. Respaldo del anterior en ~/.config-backup-*/tmux.conf
# Cambios: Catppuccin v2 bien configurado, barra rediseñada, y status-interval
# de 1s a 5s (la barra gastaba ~12% de un núcleo lanzando 3 procesos por segundo).

# ─── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # opciones sensatas de base
set -g @plugin 'tmux-plugins/tmux-yank'          # portapapeles
set -g @plugin 'christoomey/vim-tmux-navigator'  # moverse entre panes y vim
set -g @plugin 'tmux-plugins/tmux-resurrect'     # guarda y restaura sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'     # autoguardado
set -g @plugin 'laktak/extrakto'                 # buscador difuso del buffer
set -g @plugin 'tmux-plugins/tmux-sessionist'    # gestor de sesiones
set -g @plugin 'alexwforsythe/tmux-which-key'    # menú de atajos
set -g @plugin 'catppuccin/tmux'
# tmux-spotify-status retirado: lo sustituye ~/.config/tmux/scripts/nowplaying.sh,
# que ademas soporta Tidal (no scriptable con AppleScript) con una sola llamada.

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-sessionist:
#   prefix + g  listar sesiones     prefix + C  nueva sesión
#   prefix + X  matar sesión        prefix + S  última sesión
#   prefix + @  promover pane a sesión nueva

# ─── Terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -s extended-keys off
set -g allow-passthrough on          # necesario para snacks.nvim y nvim 0.11+

# ─── Prefijo y atajos ─────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Recargar la configuración sin reiniciar tmux
bind r source-file ~/.tmux.conf \; display-message "  tmux.conf recargado"

# ─── Modo vim y copiado ───────────────────────────────────────────────────────
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# ─── Comportamiento general ───────────────────────────────────────────────────
set -g mouse on
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on           # al cerrar una ventana, renumera el resto
set -g history-limit 50000           # más scrollback
set -g escape-time 10                # menos retardo al pulsar Esc en vim
set -g focus-events on

# Renombrado automático de ventanas
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set -g allow-rename on
set -g set-titles off

# ─── Gestión de sesiones ──────────────────────────────────────────────────────
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"
bind R command-prompt -p "Rename session:" "rename-session '%%'"

# Selector de sesiones que oculta las flotantes (las que empiezan por f-)
bind s choose-tree -Zs -f '#{?#{m:f-*,#{session_name}},0,1}'

# Ventana flotante por sesión (Alt+g para entrar y salir)
bind-key -n M-g if-shell -F '#{m:f-*,#{session_name}}' {
  detach-client
} {
  run-shell -b '\
    SESS=$(tmux display-message -p "#S"); \
    DIR=$(tmux display-message -p "#{pane_current_path}"); \
    tmux display-popup -w 80% -h 85% -d "$DIR" -b rounded -s "fg=#585b70" -S "bg=#181825" -T " $SESS " -E "tmux new-session -A -s f-$SESS"'
}

# ─── Tema Catppuccin Mocha ────────────────────────────────────────────────────
# OJO: este plugin es la v2. Antes la config usaba nombres de la v1
# (@catppuccin_flavour con grafía británica, @catppuccin_status_modules_*) que la
# v2 ignora en silencio — por eso el tema no se aplicaba del todo.
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
# Espacio a ambos lados del nombre para que las pestañas respiren
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
# Sin iconos de estado por pestaña: el color ya distingue la activa
set -g @catppuccin_window_flags "none"

# Hueco entre pestañas, para que no queden pegadas unas a otras
set -g window-status-separator "  "

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Bordes de los panes
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"

# ─── Barra de estado ──────────────────────────────────────────────────────────
# Refresco cada 5 s en lugar de 1 s: la barra lanzaba 3 procesos por segundo
# (~12% de un núcleo con la terminal abierta todo el día).
set -g status-interval 5
# OJO con estos límites: tmux los mide sobre la longitud CRUDA de la cadena,
# incluyendo el texto completo de cada `#(...)`. Las rutas de los scripts de
# Spotify y continuum suman ~300 caracteres, así que con el valor por defecto
# (100) todo lo que va detrás — la hora y la fecha — se cortaba y no se veía.
set -g status-left-length 200
set -g status-right-length 1000
set -g status-justify left

# Izquierda: icono de terminal + nombre de sesión + separador, con el mismo
# lenguaje visual que la derecha (icono en color, texto claro, barra ▐ gris).
# El módulo de catppuccin pegaba el icono al nombre sin separación alguna.
set -g status-left "#[fg=#a6e3a1,bold]   #S  #[fg=#585b70]▐ "

# Derecha: hora y fecha, cada una con su icono y separadas por espacio.
# OJO: NO se llama aquí a spotify.sh — el plugin antepone su propio módulo a
# status-right cuando se carga. Ponerlo también aquí lo duplicaba en pantalla
# y ejecutaba el script dos veces por refresco.
set -g status-right "#(~/.config/tmux/scripts/nowplaying.sh)"
set -ag status-right "#[fg=#585b70]  ▐  #[fg=#cdd6f4]%H:%M  "

# Sesiones flotantes (popup de Alt+g): barra mínima abajo. Aquí solo las
# opciones de SESIÓN; el formato de las ventanas se envuelve tras TPM (abajo),
# porque window-status-format es opción de ventana y no se hereda por sesión.
set-hook -g session-created 'if-shell -F "#{m:f-*,#{session_name}}" "\
  set status on; \
  set status-position bottom; \
  set status-style bg=default; \
  set status-justify centre; \
  set status-left \"\"; \
  set status-right \"\"; \
  set status-interval 60"'


# ─── TPM (debe ir al final) ───────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ─── Ajustes que deben ir DESPUÉS de los plugins ──────────────────────────────
# tmux-spotify-status fuerza `status-interval 1` al cargarse para que el título
# de la canción haga scroll suave. Eso son 3 procesos por segundo, todo el día:
# ~12% de un núcleo medido. Lo devolvemos a 5 s aquí, ya cargado el plugin.
# El nombre de la canción se sigue viendo; solo el desplazamiento va a saltos.
# Si prefieres el scroll suave, sube el número o borra estas dos líneas.
set -g status-interval 5

# Formatos de ventana condicionados al tipo de sesión (ver el script)
run-shell '~/.config/tmux/scripts/float-setup.sh'

# tmux-sessionist reasigna prefix+S (ir a la ultima sesion) y prefix+C-s al
# cargarse con TPM, pisando estos dos. Por eso van aqui abajo: definidos despues
# del plugin, ganan ellos.
bind C-s choose-tree -Zs
bind S command-prompt -p "New session name:" "new-session -s '%%'"
