# vim:fileencoding=utf-8:foldmethod=marker
#: Fonts {{{
# 1. Fuente Principal (Limpia y con ligaduras)
font_family      Iosevka Term Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# 3. Ajustes de Renderizado para Mac M4
macos_thicken_font 0.30
macos_quit_when_last_window_closed yes

# 4. Corrección de Centrado Vertical y Espaciado
# Esto arregla que las letras no se vean centradas en la celda
modify_font baseline 0px
modify_font cell_height 105%

# Habilitar ligaturas
# Estaba dos veces (titlebar-only y yes); ganaba la segunda, así que dejamos solo esa
hide_window_decorations yes

#: The foreground and background colors.
background_opacity 0.95
# background_blur 0

# --- Catppuccin Mocha ---
background #1E1E2E
foreground #CDD6F4

selection_background #45475A
selection_foreground #CDD6F4

url_color #F5E0DC
cursor #F5E0DC

# --- Tabs ---
active_tab_background #45475A
active_tab_foreground #CDD6F4
inactive_tab_background #1E1E2E
inactive_tab_foreground #6C7086

# --- Normal colors ---
color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE

# --- Bright colors ---
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8

# Key mappings
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# make option key work for alt-f / alt-b
macos_option_as_alt yes

# ─── Pulido añadido 2026-08-17 ────────────────────────────────────────────────
# La paleta ya era Catppuccin Mocha y no se ha tocado. Esto solo suma detalles.

# Estela suave del cursor (kitty 0.37+). Pon 0 para desactivarla.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_shape block
cursor_blink_interval 0

# Aire alrededor del contenido
window_padding_width 8 10

# Barra de pestañas al estilo Catppuccin
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}  {title}"
active_tab_font_style bold
tab_bar_background #181825
active_tab_background #CBA6F7
active_tab_foreground #11111B
inactive_tab_background #313244
inactive_tab_foreground #A6ADC8

# Bordes de ventana en la paleta
active_border_color #CBA6F7
inactive_border_color #45475A
bell_border_color #F9E2AF

# Más historial y sin campana audible
scrollback_lines 20000
enable_audio_bell no
visual_bell_duration 0

# La confirmación al cerrar estorba cuando siempre hay tmux con procesos
confirm_os_window_close 0
